# ===================================================================
# 知语 AI 本地秘密配置模板
#
# 部署流程（Windows）：
#   1) 拷贝到 D:\conf\zwsk\zwsk-secret.yaml
#      （或项目根下 ./conf/zwsk-secret.yaml，两处都会被自动 import）
#   2) 替换所有 REPLACE_WITH_* 占位符为真实值
#   3) 设置文件权限仅当前用户可读：
#      icacls "D:\conf\zwsk\zwsk-secret.yaml" /inheritance:r /grant:r "$($env:USERNAME):R"
#
# 加载原理：
#   application-dev.yaml 顶部有 `spring.config.import: optional:file:D:/conf/zwsk/...`
#   import 进来的 yaml 会**覆盖**主 yaml 里的同名 property。
#
# 安全约束：
#   - 本文件真实副本已在 .gitignore 中（`zwsk-secret.yaml` / `conf/`）
#   - **绝对不要** 把填好的版本贴到聊天、截图、GitHub 上
#   - 如意外泄露：① 阿里云控制台 revoke ② 重生成 ③ BFG 清 git 历史
# ===================================================================

# ──────────────────────────────────────────────────────────────────
# ① AI / 语音 API Key（顶层 property，被占位符 ${DASHSCOPE_API_KEY:} 消费）
#
#    application-dev.yaml 里 4 处 api-key 都写成 ${DASHSCOPE_API_KEY:}：
#      - zwsk.ai.chat.api-key         （对话模型）
#      - zwsk.ai.embedding.api-key    （向量模型）
#      - zwsk.ai.dashscope.api-key    （百炼 SDK 统一入口）
#      - zwsk.voice.openai.api-key    （语音 OpenAI 兼容网关，复用同 key）
#    在这里定义顶层 DASHSCOPE_API_KEY 后，4 处会自动拿到同一把 key。
# ──────────────────────────────────────────────────────────────────
DASHSCOPE_API_KEY: REPLACE_WITH_YOUR_DASHSCOPE_API_KEY

# 如需针对某个接口单独指定不同的 key（例如语音真的要切回官方 OpenAI），
# 用嵌套形式显式覆盖对应的 property 路径，优先级高于上面的顶层 key：
# zwsk:
#   voice:
#     openai:
#       api-key: REPLACE_WITH_OPENAI_API_KEY

# ──────────────────────────────────────────────────────────────────
# ② JWT 签名密钥（≥ 64 字节随机；生产必须通过本文件或环境变量覆盖默认值）
#    生成命令（PowerShell）：
#      [Convert]::ToBase64String((1..64 | ForEach-Object {Get-Random -Maximum 256}))
# ──────────────────────────────────────────────────────────────────
JWT_SECRET: REPLACE_WITH_64_BYTE_RANDOM_STRING_BASE64_OR_HEX

# ──────────────────────────────────────────────────────────────────
# ③ 数据库 / Redis / RabbitMQ 凭据（覆盖 application-dev.yaml 的默认值）
# ──────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/zwskchat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: zwsk
    password: REPLACE_WITH_YOUR_MYSQL_PASSWORD
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ""                       # Memurai 默认无密码；生产通过 memurai.conf 设置 requirepass 后填入
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: zwsk
    password: REPLACE_WITH_YOUR_RABBIT_PASSWORD

# ──────────────────────────────────────────────────────────────────
# ④ MinIO 对象存储（如不用可删本段）
# ──────────────────────────────────────────────────────────────────
# MINIO_ACCESS_KEY: REPLACE_WITH_YOUR_MINIO_AK
# MINIO_SECRET_KEY: REPLACE_WITH_YOUR_MINIO_SK

