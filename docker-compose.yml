version: "3.9"

# 展望数科 - 知语 AI 企业语音 RAG 助手 / 本地依赖一键启动
# 仅供开发与本地测试使用。生产环境请使用独立运维方案，并通过环境变量注入凭据。

x-default-restart: &restart unless-stopped

services:
  mysql:
    image: mysql:8.0
    restart: *restart
    container_name: zwsk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DB:-zwskchat}
      MYSQL_USER: ${MYSQL_USER:-zwsk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=500
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks: [zwsk]

  redis:
    image: redis:7.2-alpine
    restart: *restart
    container_name: zwsk-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./data/redis:/data
    networks: [zwsk]

  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: *restart
    container_name: zwsk-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks: [zwsk]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: *restart
    container_name: zwsk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./data/minio:/data
    networks: [zwsk]

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: *restart
    container_name: zwsk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-zwsk}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?RABBIT_PASSWORD must be set}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks: [zwsk]

  # 知语 AI 后端（Spring Boot）
  # 单机演示部署：docker-compose up -d 一把起；生产请走 K8s + Helm 或独立 Dockerfile + Ingress。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: zwsk/zwskchat:${APP_VERSION:-latest}
    restart: *restart
    container_name: zwsk-app
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      # JWT_SECRET 必须从 .env 注入；启动时 JwtTokenProvider 会校验长度 >= 32 字节，
      # 检测到 dev 默认串且 profile=prod 直接拒启动。
      JWT_SECRET: ${JWT_SECRET}
      # 数据库 / Redis / RabbitMQ：用 compose 内部 DNS（service 名）寻址，避免硬编码 IP
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-zwskchat}
      MYSQL_USER: ${MYSQL_USER:-zwsk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_DB: 0
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER:-zwsk}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?RABBIT_PASSWORD must be set}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-zwsk-private}
      # AI 模型 Key：DashScope 三件套（Chat/Embedding/语音）共用一把
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY must be set}
      # JVM 容器化：默认堆 = 容器内存 75%，可在 .env 里覆盖（比如 4G 容器用 -Xmx 显式锁）
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
    ports:
      # 仅监听本地回环；公网入口由 nginx 反代 + TLS 卸载
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/app/logs
    networks: [zwsk]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: *restart
    container_name: zwsk-nginx
    depends_on: [app]
    ports:
      - "127.0.0.1:8081:80"
      # 取消注释开启 HTTPS。前提：把证书挂到 ./docker/nginx/certs 目录
      # - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # 取消注释挂载证书：./docker/nginx/certs/{fullchain.pem,privkey.pem}
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks: [zwsk]

networks:
  zwsk:
    driver: bridge
