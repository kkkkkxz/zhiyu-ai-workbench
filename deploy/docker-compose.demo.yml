# 演示模式 docker-compose（一键启动，无需 SSL 证书）
# 用法：docker compose -f docker-compose.demo.yml up -d

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    container_name: zwsk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DB:-zwskchat}
      MYSQL_USER: ${MYSQL_USER:-zwsk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=100
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    container_name: zwsk-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: unless-stopped
    container_name: zwsk-qdrant
    volumes:
      - qdrant-data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    container_name: zwsk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-zwsk}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?RABBIT_PASSWORD must be set}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    container_name: zwsk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: zwsk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set zwsk http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb -p zwsk/${MINIO_BUCKET:-zwsk-kb} || true;
      exit 0;
      "
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zwsk/zwskchat:demo
    restart: unless-stopped
    container_name: zwsk-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ZWSK_BOOTSTRAP_RESET_ADMIN_PASSWORD: ${ZWSK_BOOTSTRAP_RESET_ADMIN_PASSWORD:-false}
      ZWSK_BOOTSTRAP_ADMIN_DEFAULT_PASSWORD: ${ZWSK_BOOTSTRAP_ADMIN_DEFAULT_PASSWORD:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-zwskchat}
      MYSQL_USER: ${MYSQL_USER:-zwsk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER:-zwsk}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?RABBIT_PASSWORD must be set}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ""
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-zwsk-kb}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      CONTENT_SAFETY_MODE: keyword
      JAVA_OPTS: -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError
    volumes:
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    container_name: zwsk-nginx
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/demo.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  rabbitmq-data:
  minio-data:
  app-logs:
