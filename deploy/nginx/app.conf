# =============================================================================
# 知语 AI · app.noweyai.com 生产入口
#
# 80:
#   - 保留 ACME HTTP-01 验证路径
#   - 其它请求全部 301 到 HTTPS
#
# 443:
#   /            -> 托管 web/dist 前端静态资源，带 SPA history 回退
#   /api/...     -> 反代到后端 app:8080（含登录限流、上传不缓冲、WS 升级）
# =============================================================================

upstream zwsk_backend {
    server app:8080;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=common_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=ws_zone:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name app.noweyai.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.noweyai.com;
    client_max_body_size 200m;
    client_body_timeout 60s;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    limit_conn conn_per_ip 50;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;

    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://zwsk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/file/upload {
        limit_req zone=upload_zone burst=4 nodelay;
        proxy_pass http://zwsk_backend;
        proxy_request_buffering off;
        client_max_body_size 200m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/voice/ws(/.*)?$ {
        limit_req zone=ws_zone burst=5 nodelay;
        proxy_pass http://zwsk_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        limit_req zone=common_zone burst=20 nodelay;
        proxy_pass http://zwsk_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
