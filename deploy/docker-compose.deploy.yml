# =============================================================================
# 知语 AI · 一键部署 compose（生产可用，全栈自包含）
#
# 用法（在服务器上）：
#   1) cd deploy && ./deploy.sh        # Linux/macOS
#      或  deploy\deploy.ps1            # Windows PowerShell
#   2) 脚本会：生成强随机密钥 -> 写 .env -> docker compose up -d --build
#   3) 访问 https://app.noweyai.com/   （nginx 443 端口，前端 + /api 反代）
#
# 与开发用的根目录 docker-compose.yml 的区别：
#   - 后端用 SPRING_PROFILES_ACTIVE=docker（零密钥、全env 注入、服务名寻址）
#   - nginx 同时托管前端 dist 静态页 + 反代 /api，实现单入口一键访问
#   - 增加 minio-init 一次性任务自动建桶，省去手工进控制台
#   - 所有密码/密钥来自 .env（由 deploy 脚本生成），仓库不含任何明文密钥
# =============================================================================

x-restart: &restart unless-stopped

services:
  mysql:
    image: mysql:8.0
    restart: *restart
    container_name: zwsk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-zwskchat}
      MYSQL_USER: ${MYSQL_USER:-zwsk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
      - --max-connections=100
      - --innodb-buffer-pool-size=256M
      - --performance-schema=OFF
    volumes:
      - mysql-data:/var/lib/mysql
      # SQL 迁移脚本仅在数据库首次初始化时按文件名顺序执行
      - ../sql:/docker-entrypoint-initdb.d:ro
    networks: [zwsk]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: redis:7.2-alpine
    restart: *restart
    container_name: zwsk-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [zwsk]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.11.5
    restart: *restart
    container_name: zwsk-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [zwsk]

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: *restart
    container_name: zwsk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-zwsk}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks: [zwsk]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: *restart
    container_name: zwsk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set in .env}
    volumes:
      - minio-data:/data
    networks: [zwsk]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  # 一次性任务：等 MinIO 就绪后自动创建业务桶，然后退出
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: zwsk-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set zwsk http://minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY} &&
      mc mb -p zwsk/${MINIO_BUCKET:-zwsk-kb} || true;
      echo 'minio bucket ready'; exit 0;
      "
    networks: [zwsk]
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zwsk/zwskchat:${APP_VERSION:-latest}
    restart: *restart
    container_name: zwsk-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-zwskchat}
      MYSQL_USER: ${MYSQL_USER:-zwsk}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      REDIS_DB: 0
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER:-zwsk}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?set in .env}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-zwsk-kb}
      # 业务必需：阿里云百炼 Key（对话/向量/语音共用一把）
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?set in .env}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError}
    volumes:
      - app-logs:/app/logs
    networks: [zwsk]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/actuator/health/liveness"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    restart: *restart
    container_name: zwsk-nginx
    depends_on:
      - app
    ports:
      # 80 仅用于 ACME 验证和跳转 HTTPS
      - "${HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端构建产物（web/dist）直接挂载给 nginx 托管
      - ../web/dist:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    networks: [zwsk]

networks:
  zwsk:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  qdrant-data:
  rabbitmq-data:
  minio-data:
  app-logs:
