# =============================================================================
# 知语 AI · Nginx 反向代理配置
# =============================================================================
# 部署形态：
#   ① docker-compose up      — upstream 走 service name `app:8080`（默认）
#   ② Windows Docker Desktop — 把 upstream 改回 host.docker.internal:8080（见下注释）
#   ③ 物理机 / VM             — 直接改成内网 IP
#
# 安全要点：
#   1) HTTPS：强烈建议启用 443 + 强制 80→443 跳转（见底部注释模板）；
#      当前默认 80-only 仅供内网 / 反向代理后端使用，不要直接暴露公网。
#   2) 限流分 zone：common（普通 API）/ upload（文档上传）/ ws（语音 WebSocket
#      握手）/ login（登录爆破防御）；
#   3) 安全响应头：HSTS / X-Frame-Options / Referrer-Policy / Permissions-Policy；
#   4) server_tokens off：不暴露 nginx 版本，避免针对性 0day 扫描。
# =============================================================================

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ---- 限流分区 ----------------------------------------------------------
    # 设计依据（按"假设公网入口"的保守值；如果是内网/SLB 后置可以放大 2~5 倍）：
    #   common_zone：业务 API。10r/s + burst 20 → 单 IP 峰值 30r/s 仍可短时穿越
    #   upload_zone：文档上传。1r/s + burst 4   → 防止持续大文件刷向量化队列
    #   ws_zone    ：WebSocket 握手。3r/s + burst 5 → 防止建连风暴
    #   login_zone：登录接口。1r/s + burst 5      → 配合后端 5 次失败锁定，反爆破
    limit_req_zone $binary_remote_addr zone=common_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=ws_zone:10m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;
    # 单 IP 并发连接上限（防止 slowloris / 长连占用）
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # 反向代理到 docker-compose 内部 app service。
    # 如果 nginx 跑在 Docker Desktop 而 Spring Boot 跑在宿主机：把下行注释起来，
    # 启用 host.docker.internal:8080 那一行。
    upstream zwsk_backend {
        server app:8080;
        # server host.docker.internal:8080;
        keepalive 32;
    }

    # 复用安全响应头（被各 server 块 include）。
    # CSP 依据前端 Vite 打包结果：允许 self + data: + blob:（音频流），第三方域要白名单。
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss: ws: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    }

    # === HTTP server (80) ====================================================
    # 生产建议：把这一段改成"301 跳转到 https://$host$request_uri"，由 443 server 处理业务。
    # 当前保留 80 端口直通业务，方便：①内网部署 ②本地开发 ③反向代理后置场景。
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        client_max_body_size 200m;
        client_body_timeout 60s;

        # 单 IP 并发连接：50 个长连接（语音 WebSocket 单连接，足够 N 标签页）
        limit_conn conn_per_ip 50;

        # ---- 安全响应头 -----------------------------------------------------
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # HSTS 只在 HTTPS 下有意义；80 端口加上对 HTTP 客户端无效，但浏览器升级到 https 后会记
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # 限制浏览器危险特性：仅自身可用麦克风（语音功能必需），其余全关
        add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp_header always;

        # ACME HTTP-01 验证（启用 443 时 Let's Encrypt webroot 模式用得上）
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # ---- 登录接口（独立限流防爆破） -----------------------------------
        location = /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://zwsk_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---- 文档上传：关 buffering，否则 200MB 的文件会塞爆 nginx 临时盘 ---
        location /api/file/upload {
            limit_req zone=upload_zone burst=4 nodelay;
            proxy_pass http://zwsk_backend;
            proxy_request_buffering off;
            client_max_body_size 200m;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 大文件上传给宽松超时
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ---- 语音 WebSocket（v1 / v2 / v3 三个协议版本同样规则） -----------
        location ~ ^/api/voice/ws(/.*)?$ {
            limit_req zone=ws_zone burst=5 nodelay;
            proxy_pass http://zwsk_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket 长连接：10 分钟无消息断开。心跳由应用层 PING/PONG 维持
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # 不要 buffering，否则会改变 PCM 帧的实时性
            proxy_buffering off;
        }

        # ---- 兜底：所有其它 /api/ 请求 ------------------------------------
        location /api/ {
            limit_req zone=common_zone burst=20 nodelay;
            proxy_pass http://zwsk_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ---- 监控：仅放给内网 IP 段抓 Prometheus ----------------------------
        # 生产建议在这里写 allow / deny。示例（K8s ClusterIP 段）：
        # location = /api/actuator/prometheus {
        #     allow 10.0.0.0/8;
        #     allow 172.16.0.0/12;
        #     deny  all;
        #     proxy_pass http://zwsk_backend;
        # }
    }

    # =========================================================================
    # === HTTPS server (443) — 生产环境模板，按需启用 ==========================
    # =========================================================================
    # 启用步骤：
    #   1) 申请证书（任选其一）：
    #      a. Let's Encrypt（免费，90 天自动续）：用 certbot 把证书放到
    #         /etc/letsencrypt/live/<domain>/fullchain.pem 和 privkey.pem
    #      b. 商业证书：把 fullchain.pem / privkey.pem 放到 /etc/nginx/certs/
    #   2) 把上面 80 server 的所有 location 块剪到 443 server 里；
    #      80 server 改成"302/301 跳转到 https://$host$request_uri"；
    #   3) docker-compose.yml 把 443 端口暴露 + 证书目录挂卷；
    #   4) 取消下面整段注释。
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.example.com;
    #     client_max_body_size 200m;
    #
    #     # ---- 证书 -----------------------------------------------------
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     # ---- TLS 协议与套件（参考 Mozilla intermediate 配置） ----------
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers off;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # ---- OCSP Stapling（让客户端跳过 OCSP 直查，握手更快） -------
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     resolver 1.1.1.1 8.8.8.8 valid=300s;
    #     resolver_timeout 5s;
    #
    #     # ---- 安全响应头 -----------------------------------------------
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #     add_header Referrer-Policy strict-origin-when-cross-origin always;
    #     add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
    #     add_header Content-Security-Policy $csp_header always;
    #
    #     # ---- 把 80 server 里的所有 location 段在这里复制一遍 -----------
    #     # （从 location = /api/auth/login 开始到 location /api/ 结束）
    # }
    #
    # # ---- 80 → 443 强制跳转（启用 443 后用这个替换原 80 server）---------
    # server {
    #     listen 80 default_server;
    #     server_name _;
    #     # 保留 ACME 验证路径
    #     location ^~ /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }
}
